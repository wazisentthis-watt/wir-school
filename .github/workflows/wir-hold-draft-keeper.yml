name: WIR HOLD draft keeper
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  return-to-draft:
    runs-on: ubuntu-latest
    # Never check out or execute untrusted pull-request code with write tokens.
    steps:
      - name: Checkout trusted base policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Return unauthorized PRs to draft while owner HOLD is active
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MODE="HOLD"
          if test -f .github/wir-hold-policy.json; then
            MODE="$(node -e "try{console.log(require('./.github/wir-hold-policy.json').mode||'HOLD')}catch{console.log('HOLD')}")"
          fi
          if [[ "$MODE" == "HOLD" && "$PR_DRAFT" == "false" ]]; then
            echo "::warning::WIR PROPOSAL/HOLD: reverting unauthorized ready-for-review state"
            gh pr ready --undo "$PR_NUMBER" --repo "$REPOSITORY"
          else
            echo "No draft action needed (mode=$MODE, already_draft=$PR_DRAFT)"
          fi
