name: Metal carried-board swing source gate (PROPOSAL)
on:
  push:
    paths:
      - 'connected/assets/main.js'
      - 'connected/tests/metal_boardback_swing_contract.test.mjs'
      - '.github/workflows/metal-boardback-swing.yml'
  pull_request:
    paths:
      - 'connected/assets/main.js'
      - 'connected/tests/metal_boardback_swing_contract.test.mjs'
      - '.github/workflows/metal-boardback-swing.yml'
permissions:
  contents: read
jobs:
  boardback-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse game module without executing missions
        run: node --check connected/assets/main.js
      - name: Verify board state and real anchor contract
        run: node --test connected/tests/metal_boardback_swing_contract.test.mjs
