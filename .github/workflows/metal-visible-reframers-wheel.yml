name: METAL Visible ReFramers + 73 Power Wheel QA (HOLD)
on:
  push:
    paths:
      - 'connected/assets/main.js'
      - 'connected/assets/metal_power_wheel*.mjs'
      - 'connected/assets/reframer_squad_world.mjs'
      - 'connected/tests/metal_power_wheel_and_reframer_visibility.test.mjs'
      - 'connected/tests/metal_visible_reframers_power_wheel_browser.mjs'
      - '.github/workflows/metal-visible-reframers-wheel.yml'
  pull_request:
    paths:
      - 'connected/assets/main.js'
      - 'connected/assets/metal_power_wheel*.mjs'
      - 'connected/assets/reframer_squad_world.mjs'
      - 'connected/tests/metal_power_wheel_and_reframer_visibility.test.mjs'
      - 'connected/tests/metal_visible_reframers_power_wheel_browser.mjs'
      - '.github/workflows/metal-visible-reframers-wheel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-ability-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax, original 73 catalog, material and squad rules
        run: |
          node --check connected/assets/main.js
          node --check connected/assets/metal_power_wheel_core.mjs
          node --check connected/assets/metal_power_wheel.mjs
          node --check connected/assets/reframer_squad_world.mjs
          node --check connected/tests/metal_visible_reframers_power_wheel_browser.mjs
          node --test connected/tests/metal_power_wheel_and_reframer_visibility.test.mjs connected/tests/metal_power_lab_core.test.mjs connected/tests/metal_adaptive_armor_core.test.mjs connected/tests/reframer_squad_core.test.mjs connected/tests/reframer_kit_savannah_bridge.test.mjs
  real-browser-scene:
    runs-on: ubuntu-latest
    needs: source-and-ability-contracts
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-fund --no-audit playwright
          npx playwright install --with-deps chromium
      - name: Host exact branch in ephemeral test server (not Pages)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/metal-visible.log 2>&1 &
          sleep 2
          curl -fI http://127.0.0.1:8765/connected/
      - name: Real ordinary mission, in-scene sighting, wheel and touch QA
        run: node connected/tests/metal_visible_reframers_power_wheel_browser.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-visible-reframers-power-wheel-QA-HOLD
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
