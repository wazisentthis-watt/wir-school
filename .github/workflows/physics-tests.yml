name: Physics regression tests
on:
  push:
    paths:
      - 'connected/assets/**'
      - 'connected/tests/**'
      - '.github/workflows/physics-tests.yml'
  pull_request:
    paths:
      - 'connected/assets/**'
      - 'connected/tests/**'
  workflow_dispatch:
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check connected/assets/main.js
          node --check connected/assets/boot_recovery.js
          node --check connected/assets/mission_asset_recovery.js
          node --check connected/assets/slotta_visuals.js
          node --check connected/assets/slotta_slots.js
          node --check connected/assets/slotta_animation_machine.js
          node --check connected/assets/slotta_choreography.js
          node --check connected/assets/slotta_encounter_guard.js
          node --check connected/assets/slotta_pose.js
          node --check connected/assets/slotta_rig_adapter.js
          node --check connected/assets/world_body.js
          node --check connected/assets/gallium_grip_core.js
          node --check connected/assets/gallium_limb.js
          node --check connected/assets/structure_conservation.js
      - name: Physics unit tests
        run: node --test connected/tests/body_machine.test.mjs connected/tests/world_body.test.mjs connected/tests/physics_telemetry.test.mjs connected/tests/physics_analysis.test.mjs connected/tests/structure_conservation.test.mjs connected/tests/gallium_grip_core.test.mjs connected/tests/slotta_asset_contract.test.mjs connected/tests/slotta_animation_machine.test.mjs connected/tests/slotta_lab_preview.test.mjs connected/tests/slotta_choreography.test.mjs connected/tests/slotta_encounter_guard.test.mjs connected/tests/slotta_browser_contract.test.mjs connected/tests/mission_asset_recovery.test.mjs
