name: METAL Morrow Motion Lab 01 QA
on:
  pull_request:
    paths:
      - 'connected/labs/motion-lab-01/**'
      - 'connected/tests/motion_lab_01*'
      - '.github/workflows/motion-lab-01-qa.yml'
  push:
    branches:
      - 'feature/connected-morrow-motion-lab01-*'
    paths:
      - 'connected/labs/motion-lab-01/**'
      - 'connected/tests/motion_lab_01*'
      - '.github/workflows/motion-lab-01-qa.yml'
  workflow_dispatch:
jobs:
  motion-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic motion QA
        run: |
          node --check connected/labs/motion-lab-01/main.js
          node --check connected/labs/motion-lab-01/physics.mjs
          node --check connected/tests/motion_lab_01_browser_playwright.mjs
          node --test connected/tests/motion_lab_01.test.mjs
      - name: Prepare browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Serve complete existing game and separate lab
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wir-lab01-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/connected/labs/motion-lab-01/ > /dev/null
      - name: Verify textured GLB, physics, mission and save isolation in Chromium
        env:
          METAL_BOOT_BASE: http://127.0.0.1:8765
        run: node connected/tests/motion_lab_01_browser_playwright.mjs
      - name: Preserve screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-motion-lab-01-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
