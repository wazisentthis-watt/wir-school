name: WIR METAL ReFramer Squad + Physical Donor Vehicles (HOLD)
on:
  push:
    paths:
      - 'connected/assets/reframer_squad_*'
      - 'connected/assets/reframer_kit_*'
      - 'connected/assets/reframer_hunt_core.mjs'
      - 'connected/assets/main.js'
      - 'connected/tests/reframer_squad_*'
      - 'connected/tests/reframer_kit_*'
      - '.github/workflows/reframer-squad-v01.yml'
  pull_request:
    paths:
      - 'connected/assets/reframer_squad_*'
      - 'connected/assets/reframer_kit_*'
      - 'connected/assets/reframer_hunt_core.mjs'
      - 'connected/assets/main.js'
      - 'connected/tests/reframer_squad_*'
      - 'connected/tests/reframer_kit_*'
      - '.github/workflows/reframer-squad-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  squad-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and original ReFramer compatibility
        run: |
          node --check connected/assets/main.js
          node --check connected/assets/reframer_squad_core.mjs
          node --check connected/assets/reframer_squad_world.mjs
          node --check connected/assets/reframer_kit_v1.js
          node --check connected/assets/reframer_kit_savannah_bridge.mjs
          node --check connected/assets/reframer_hunt_core.mjs
          node --check connected/tests/reframer_squad_browser_playwright.mjs
          node --test connected/tests/reframer_squad_core.test.mjs connected/tests/reframer_hunt_core.test.mjs connected/tests/draw_combo_reframer.test.mjs connected/tests/reframer_kit_savannah_bridge.test.mjs
  physical-scene:
    runs-on: ubuntu-latest
    needs: squad-contracts
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for WebGL and touch simulation
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Serve unmerged source locally (never Pages)
        run: |
          mkdir -p test-results
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/reframer-squad.log 2>&1 &
          sleep 2
          curl -fI http://127.0.0.1:8765/connected/
      - name: Test normal Mission 01, mobile, 2 real donor GLBs and part inventory
        run: node connected/tests/reframer_squad_browser_playwright.mjs
      - name: Attach truthful QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reframer-squad-source-glb-scene-tests-HOLD
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
