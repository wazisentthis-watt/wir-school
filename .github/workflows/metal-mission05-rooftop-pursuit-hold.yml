name: METAL Mission 05 Rooftop Pursuit full game QA (PROPOSAL HOLD)

on:
  pull_request:
    paths:
      - 'connected/assets/metal_rooftop_pursuit*'
      - 'connected/assets/metal_aerial_duel_*'
      - 'connected/assets/testyard_skate_adapter.mjs'
      - 'connected/assets/main.js'
      - 'connected/assets/style.css'
      - 'connected/tests/metal_mission05_*'
      - 'connected/tests/metal_aerial_duel_core.test.mjs'
      - '.github/workflows/metal-mission05-rooftop-pursuit-hold.yml'
  push:
    branches:
      - 'feature/metal-mission05-rooftop-pursuit-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission05-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse full real game and mission modules without modifying saves
        run: |
          set -euo pipefail
          node --check connected/assets/main.js
          node --check connected/assets/metal_aerial_duel_core.mjs
          node --check connected/assets/metal_aerial_duel_pilot.js
          node --check connected/assets/metal_rooftop_pursuit_core.mjs
          node --check connected/assets/metal_rooftop_pursuit.js
          node --check connected/tests/metal_mission05_browser_playwright.mjs
      - name: Deterministic mission, original Test Yard, ReFramer and core regression gates
        run: |
          node --test \
            connected/tests/metal_mission05_core.test.mjs \
            connected/tests/metal_aerial_duel_core.test.mjs \
            connected/tests/testyard_skate_adapter.test.mjs \
            connected/tests/metal_boardback_swing_contract.test.mjs \
            connected/tests/metal_skylab_v3_bridge.test.mjs \
            connected/tests/mission_asset_recovery.test.mjs \
            connected/tests/metal_forge_mobile_input.test.mjs
      - name: Install Chromium browser runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Host exact PR checkout privately, never deploy
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/m05-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/connected/ > /dev/null
      - name: Play Mission 05 on real engine, test controllers, phone touch, full combat and save/reload
        env:
          METAL_BOOT_BASE: http://127.0.0.1:8765
        run: node connected/tests/metal_mission05_browser_playwright.mjs
      - name: Preserve local-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission05-rooftop-pursuit-proposal-hold
          path: test-results/mission05_*
          if-no-files-found: warn
          retention-days: 7
