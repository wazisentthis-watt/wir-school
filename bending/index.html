function perform(t,e){ const m=mod(), A=det.S.anchors, W=FX.W,H=FX.H, core=A.rightWrist||{x:W/2,y:H/2};
  const dir=e?.dx||(core.x>W/2?1:-1);
  if(!canShape(t)){ say(`Nothing to shape: "${t.name}" needs ${t.needs.join(', ')} nearby. Material now: ${getMaterial()}.`); return false; }
  say(`${t.name}  ·  ${getMaterial()} x${m.power.toFixed(1)}`); ST.glow=1;
  if(t.fx==='slab'){ const k=rockSpawn(core.x,H*.6,58*m.size); // rises OUT of the floor (fx.js spawns below the floor line)
    if(k) setTimeout(()=>{k.mode='free';k.vx=dir*1300*m.speed;k.vy=-250;FX.shake=4;},250); }
  if(t.fx==='slabbreak'){ for(let i=0;i<3;i++){ const r=rockSpawn(core.x+rnd(-160,160),H*.75,28*m.size); if(r){r.mode='free';r.vx=dir*rnd(500,1100)*m.speed;r.vy=-rnd(500,900);} } dust(core.x,H-6,40,1.2); FX.shake=9*m.power; }
  if(t.fx==='water'){ // drawn up from the existing water at floor level toward the Left Core, then sent out
    for(let i=0;i<110*m.size;i++) waterSpawn(rnd(W*.2,W*.8),H-4,dir*rnd(300,900)*m.speed,-rnd(700,1200),0,2.5); }
  if(t.fx==='air'||t.fx==='clasp'){ addField({type:'blast',x:core.x,y:core.y,r:380*m.size,str:(t.fx==='clasp'?6500:4500)*m.power,dur:.4});
    for(let i=0;i<60;i++) L.streak.spawn(core.x+rnd(-80,80),core.y+rnd(-120,120),dir*rnd(700,1400)*m.speed,rnd(-150,150),{life:rnd(.5,1),w:rnd(2,4),lag:8});
    if(t.fx==='clasp'){ lightAt(core.x,core.y,[.9,.85,1],5); FX.flash=.35; } }
  if(t.fx==='body'){ lightAt(core.x,core.y,[1,.8,.5],3); FX.shake=6*m.power; } // Body Art: no visible String
  if(t.fx==='tether'){ const k=rockSpawn(core.x,H*.6,50*m.size); if(k) tether={k,t:det.S.t}; }
  if(t.fx==='seed'){ seeds.push({x:core.x,t:det.S.t+3,str:m.size}); say('Seed planted (limited pattern). Pops in 3s.'); }
  if(t.fx==='lash'){ lashT=.5; addField({type:'blast',x:core.x+dir*200,y:core.y,r:220*m.size,str:3500*m.power,dur:.25});
    for(let i=0;i<40;i++) L.streak.spawn(core.x,core.y,dir*rnd(900,1600),rnd(-60,60),{life:rnd(.3,.6),w:2,lag:6}); }
  FX.shake=Math.max(FX.shake||0,3); // recoil: conservation — the body feels it
  return true; }

  const st=COMBO[CB.i]; if(st&&st.moves.includes(name)){ CB.i++; CB.t=T; CB.best=Math.max(CB.best,CB.i);
    if(CB.i>=COMBO.length){ CB.i=0; CB.done++; ST.score.combos=(ST.score.combos||0)+1; say('FULL COMBO: '+COMBO.map(c=>c.id).join(' → ')); FX.flash=.4; bump('combo'); } } }
function onEvent(e){
  if(['armsdown','wobble','recover','return','notice'].includes(e.name)) MODE.ev(e);
  if(e.name==='armsdown'){ if(tether){ tether.k.mode='free'; tether=null; } if(CB.i===COMBO.length-1) comboFeed('return'); if(chains.active().length){ chains.clearActive(); ST.score.cleanAborts++; say('Clean abort. Good control.'); } return; }
  if(e.name==='wobble'){ if(chains.active().length||CB.i>0||tether){ CB.i=0; if(tether){tether.k.mode='free';tether=null;} breakChain('balance lost'); } return; }
  if(e.name==='return'){ if(tether){tether.k.mode='free';tether=null;} comboFeed('return'); say('Return: energy brought home.'); return; }
  if(e.name==='notice'){ comboFeed('notice'); return; }
  if(e.name==='recover'){ comboFeed('recover'); ST.needRecover=false; ST.score.recoveries++; say('Recovered. Contact re-established.'); bump('recover'); return; }

  g.shadowBlur=0; }
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
let last=performance.now(), frame=0;
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.05,(now-last)/1000); last=now; frame++;
  let pts=null;
  if(pose&&video.readyState>=2){ const r=pose.detectForVideo(video,now); if(r.landmarks?.[0]) pts=r.landmarks[0].map(toScreen);
    if(hands&&frame%2===0) handRes=hands.detectForVideo(video,now); }
  const {ev,S}=det.update(pts,dt); ev.forEach(onEvent);
  if(ST.needRecover&&S.recoverReady) onEvent({name:'recover',t:S.t});
  if(!ST.needRecover&&LESSONS[ST.lesson]?.ev==='recover'&&S.recoverReady&&!ST.pr){ ST.pr=1; onEvent({name:'recover',t:S.t}); } if(!S.recoverReady) ST.pr=0;
  if(chains.timeouts(S.t).length) say('String faded (too slow). No penalty; start the chain again.'); // CHANGED: a timeout is a fade, not a break (PROPOSAL)
  if(!pts&&ST.lesson===0&&ST.camFail) {}
  seeds=seeds.filter(sd=>{ if(S.t<sd.t) return true; const r=rockSpawn(sd.x,FX.H*.65,40*sd.str); if(r){r.mode='free';r.vy=-900;} dust(sd.x,FX.H-6,30,1); return false; });
  if(tether&&!ROCK_ALIVE(tether.k)) tether=null;
  const full=pts&&[0,27,28].every(i=>pts[i].v>.5); ST.fullT=full?ST.fullT+dt:0; if(full) ST.active+=dt;
  if(MODE.id==='train'&&LESSONS[ST.lesson]?.goal?.(ST)) nextLesson();
  FXM.step(dt);
  g.clearRect(0,0,FX.W,FX.H);
  if(S.P){ g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=3; for(const [a,b] of BONES){ g.beginPath(); g.moveTo(S.P[a].x,S.P[a].y); g.lineTo(S.P[b].x,S.P[b].y); g.stroke(); }
    const prog=Math.max(0,...TECH.map(t=>chains.progress(t.id)/t.steps.length)); drawStrings(S.anchors,Math.min(1,prog+ST.glow*.6+(S.rooted?.15:0))); }
  if(handRes?.landmarks) for(const h of handRes.landmarks){ g.fillStyle='rgba(255,230,160,.8)'; for(const p of h){ const q=toScreen(p); g.fillRect(q.x-2,q.y-2,4,4);} }
  for(const sd of seeds){ g.fillStyle='rgba(160,255,140,.8)'; g.beginPath(); g.arc(sd.x,FX.H-14,6+3*Math.sin(FX.t*8),0,7); g.fill(); }
  const cA=S.anchors?.rightWrist||{x:FX.W/2,y:FX.H/2};
  if(tether){ g.strokeStyle='rgba(180,255,160,.85)'; g.lineWidth=3; g.beginPath(); g.moveTo(cA.x,cA.y); g.lineTo(tether.k.x,tether.k.y); g.stroke(); }
  if(lashT>0){ lashT-=dt; g.strokeStyle=`rgba(220,240,255,${lashT*2})`; g.lineWidth=4; g.beginPath(); g.moveTo(cA.x,cA.y); g.quadraticCurveTo(cA.x+120,cA.y-80*Math.sin(FX.t*30),cA.x+300,cA.y); g.stroke(); }
  MODE.step(dt,S); MODE.draw(g,S);
  ST.glow=Math.max(0,ST.glow-dt); ST.msgT-=dt; hud(); }
function hud(){ const Ls=LESSONS[ST.lesson], sc=ST.score; if(MODE.id!=='train'){ $('teacher').innerHTML=MODE.hud(); $('say').textContent=ST.msgT>0?ST.msg:''; $('fit').innerHTML=`Techniques ${sc.techniques} · Clean aborts ${sc.cleanAborts} · Recoveries ${sc.recoveries} · Breaks ${sc.breaks} · ~${ST.kcal.toFixed(1)} kcal`; $('chain').innerHTML=''; return; }
  $('teacher').innerHTML=`<b>${TEACHER}</b> · Lesson ${Math.min(ST.lesson+1,LESSONS.length)}/${LESSONS.length}<br><i>${Ls?Ls.title:'Free training'}</i><br>${ST.needRecover?'<b>Recover first:</b> drop output, breathe, sink into stance, stay still.':(Ls?Ls.cue:'Any technique, any order.')}`+(Ls?.reps?`<br>Reps: ${ST.reps}/${Ls.reps}`:'');
  const shown=Ls?.tech?TECH.filter(t=>t.id===Ls.tech):TECH;
  $('chain').innerHTML=shown.map(t=>`<div><small>[${typeOf(t).label}]</small> ${t.name.replace(' (PROPOSAL)','')}${canShape(t)?'':' <s>no matter</s>'}: `+t.steps.map((st,i)=>`<span class="${i<chains.progress(t.id)?'ok':''}">${t.stageNames?.[i]||st}</span>`).join(' → ')+'</div>').join('');
  $('combo').innerHTML='<b>Combo (PROPOSAL mapping)</b> · done '+CB.done+'<br>'+COMBO.map((c,i)=>`<span class="${i<CB.i?'ok':''}">${c.id}</span>`).join(' → ')+(COMBO[CB.i]?'<br><small>Next: '+COMBO[CB.i].cue+'</small>':'');
  $('fit').innerHTML=`Combos ${sc.combos||0} · Techniques ${sc.techniques} · Clean aborts ${sc.cleanAborts} · Recoveries ${sc.recoveries} · Breaks ${sc.breaks}<br>Reps: ${Object.entries(ST.moves).map(([k,v])=>k+' '+v).join(' · ')||'—'}<br>Active ${Math.round(ST.active)}s · ~${ST.kcal.toFixed(1)} kcal <small>(rough estimate, not medical)</small>`;
  $('say').textContent=ST.msgT>0?ST.msg:''; }
requestAnimationFrame(loop);
</script>
