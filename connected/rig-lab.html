<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WIR Metal Rig Lab</title><style>body{font:15px system-ui;background:#11111a;color:#eee;margin:24px}button{padding:12px;background:#9b5cff;color:white;border:0;border-radius:8px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border-bottom:1px solid #454050;padding:10px;text-align:left}code{color:#bbaaff}pre{white-space:pre-wrap}</style><script type="importmap">{"imports":{"three":"./assets/lib/three.module.min.js","three/addons/":"./assets/lib/addons/"}}</script></head><body><h1>Metal Rig Compatibility Lab</h1><p>Read-only GLB scan. No game state, animation, or live deployment changes.</p><button id="run">Inspect all six Metal models</button><p id="status">Ready</p><table><thead><tr><th>Model</th><th>Bones</th><th>Skinned meshes</th><th>Clips</th><th>Shared bones</th><th>Next action</th></tr></thead><tbody id="results"></tbody></table><pre id="detail"></pre><script type="module">import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {compareRigs,inspectRig} from './assets/rig_diagnostics.js';const files=['metal_phase6_fight.glb','metal_rigged_PLACEHOLDER.glb',...['S1','S2','S3','S4'].map(n=>'forms/metal_'+n+'_PROPOSAL.glb')];const loader=new GLTFLoader();document.getElementById('run').onclick=async()=>{const tbody=document.getElementById('results');tbody.textContent='';let driver=null;for(const file of files){document.getElementById('status').textContent='Loading '+file;const tr=document.createElement('tr');tbody.append(tr);const cell=(value)=>{const td=document.createElement('td');td.textContent=String(value);tr.append(td)};try{const gltf=await loader.loadAsync('./assets/models/metal/'+file);if(!driver)driver=gltf;const info=inspectRig(gltf),cmp=compareRigs(driver,gltf);cell(file);cell(info.bones.length);cell(info.skins.length);cell(info.clips.length);cell(cmp.sharedBones.length);cell(cmp.recommendation);tr.onclick=()=>document.getElementById('detail').textContent=JSON.stringify({file,comparison:cmp,bones:info.bones,clips:info.clips,skins:info.skins.map(s=>({mesh:s.mesh,bones:s.bones.length}))},null,2);}catch(e){cell(file);cell('LOAD ERROR');cell('');cell('');cell('');cell(e.message)}}document.getElementById('status').textContent='Inspection complete. Click any row for details.'};</script></body></html>
