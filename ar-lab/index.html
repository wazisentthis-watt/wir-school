<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Oscar's Absurd AR Lab — WIR School</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head><body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<canvas id="char"></canvas>
<canvas id="skel"></canvas>
<div id="flash"></div>

<div id="gate" class="screen" hidden></div>

<div id="hud" hidden>
  <div id="modes"><button data-m="water" class="m-water">Water</button><button data-m="fire" class="m-fire">Fire</button><button data-m="earth" class="m-earth">Earth</button><button data-m="air" class="m-air">Air</button><button data-m="atoms" class="m-atoms">Atoms</button><button data-m="gear" class="m-gear">Gear</button><button data-m="chem" class="m-chem">Chem</button></div>
  <div id="gest"></div><div id="atomLabels" hidden></div><div id="ptable" hidden></div><div id="energy" hidden></div><div id="atip" hidden></div><div id="chal" hidden></div><div id="gearLabels" hidden></div><div id="classes" hidden></div><div id="camOn" hidden></div><div id="lightwarn" hidden></div><div id="gnow"></div><div id="gsay"></div>
  <div id="shelf"></div>
  <div id="targets"></div>
  <div id="cursor"></div>
  <div id="palm"><div id="palmFill"></div></div>
  <div id="status">Starting…</div>
  <div id="bar">
    <button id="flip">Flip camera</button>
    <button id="ignite">Ignite</button>
    <button id="reset">Reset</button>
    <button id="boost">Boost: Auto</button>
    <button id="calib">Calibrate</button>
    <button id="clBtn">Classes</button>
    <button id="bodyBtn">Body: off</button>
    <button id="stillBtn" title="Prop the phone up: elements only affect items in frame">Stationary: auto</button>
    <button id="wipeBtn" class="danger">Wipe data</button>
    <label><input type="checkbox" id="lowpow"> Low power</label>
    <span id="fps"></span>
  </div>
  <div id="hint" hidden></div>
  <div id="calbox" hidden><div class="cbig" id="calIcon">1</div><div id="calMsg">Show your open hand to the camera</div><div class="pbar"><div id="calFill"></div></div><button id="calSkip">Skip</button></div>
  <div id="camerr" hidden></div>
  <div id="card" hidden><div class="inner" id="cardBody"></div><button id="cardClose">Got it, back to lab</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="profile.js"></script>
<script src="gate.js"></script>
<script type="module" src="app.js"></script>
</body></html>
