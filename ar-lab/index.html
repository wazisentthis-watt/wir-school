<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Oscar's Absurd AR Lab — WIR School</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head><body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<canvas id="skel"></canvas>
<div id="flash"></div>

<div id="gate" class="screen" hidden></div>

<div id="hud" hidden>
  <div id="shelf"></div>
  <div id="targets"></div>
  <div id="cursor"></div>
  <div id="palm"><div id="palmFill"></div></div>
  <div id="status">Starting…</div>
  <div id="bar">
    <button id="flip">🔄 Camera</button>
    <button id="ignite">🔥 Ignite</button>
    <button id="reset">♻️ Reset</button>
    <button id="boost">🌙 Boost: Auto</button>
    <button id="calib">✋ Calibrate</button>
    <label><input type="checkbox" id="lowpow"> Low power</label>
    <span id="fps"></span>
  </div>
  <div id="hint" hidden></div>
  <div id="calbox" hidden><div class="cbig" id="calIcon">✋</div><div id="calMsg">Show your open hand to the camera</div><div class="pbar"><div id="calFill"></div></div><button id="calSkip">Skip</button></div>
  <div id="camerr" hidden></div>
  <div id="card" hidden><div class="inner" id="cardBody"></div><button id="cardClose">Got it, back to lab</button></div>
</div>
<script src="gate.js"></script>
<script type="module" src="app.js"></script>
</body></html>
